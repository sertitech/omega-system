name: CI

# Run the same gate locally and for every proposed or merged change.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least privilege: the workflow only reads repository content.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt · clippy · test · coverage (${{ matrix.os }})
    # Local-first project targets macOS; ubuntu guards against Linux-only
    # regressions (it already caught the shell pipeline-kill bug). fail-fast
    # off so one platform's failure doesn't cancel the other's signal.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the version and components; a bare install
      # reads it.
      - name: Install pinned toolchain
        run: |
          rustup toolchain install
          rustc --version

      # Pinned for a deterministic coverage number (a value flickering across
      # 99/100 would block merges spuriously).
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked --version 0.8.7

      # The gate itself lives in ./check, shared with hooks/pre-push and local
      # runs. `shell: bash` is load-bearing: only the explicit form runs with
      # pipefail, without which tee's exit status would mask a failing gate.
      - name: Check (fmt · clippy · test · scoped 100% coverage)
        shell: bash
        run: ./check | tee check.log

      - name: Publish coverage summary
        if: always()
        run: |
          {
            echo '### Hermetic coverage (scoped 100% gate)'
            echo ''
            echo 'Gate: 100% of hermetic lines. Excluded from scope: `src/main.rs`'
            echo 'and the `*_live.rs` modules (live-API/TTY tails, unreachable'
            echo 'without secrets or a terminal).'
            echo ''
            echo '~~~'
            grep -E '^(Filename|TOTAL) ' check.log || echo 'coverage did not run'
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
